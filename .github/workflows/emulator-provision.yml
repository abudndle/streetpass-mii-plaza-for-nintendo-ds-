name: Emulator provisioning diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/emulator-provision.yml'
      - 'tools/emulator_preflight.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/emulator-provision.yml'

permissions:
  contents: read

concurrency:
  group: emulator-provision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Linux package index
        run: sudo apt-get update
      - name: Install AppImage runtime libraries
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libegl1 libgl1 libfuse2t64 libxcb-cursor0
      - name: Attempt distro melonDS and AzaharPlus installation
        shell: bash
        run: |
          set -euo pipefail
          for package in melonds azaharplus azahar; do
            if apt-cache show "$package" >/dev/null 2>&1; then
              echo "Installing available emulator package: $package"
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$package"
            else
              echo "Package $package unavailable in this runner's Ubuntu apt repositories"
            fi
          done
          echo 'Unavailable packages remain BLOCKED, not installed or tested'
      - name: Download official Linux AppImages if distro packages are unavailable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/emulators"
          for spec in 'melonDS:melonDS-emu/melonDS' 'AzaharPlus:AzaharPlus/AzaharPlus'; do
            name="${spec%%:*}"
            repository="${spec#*:}"
            if [[ "$name" == 'melonDS' ]] && { command -v melonDS >/dev/null || command -v melonds >/dev/null; }; then continue; fi
            if [[ "$name" == 'AzaharPlus' ]] && { command -v azaharplus >/dev/null || command -v azahar >/dev/null; }; then continue; fi
            echo "Inspecting official upstream release for $name ($repository)"
            api="https://api.github.com/repos/$repository/releases/latest"
            metadata="$(curl --fail --location --silent --show-error --retry 3 --max-time 30 "$api")"
            tag="$(jq -r '.tag_name // empty' <<<"$metadata")"
            echo "Official release $repository tag=$tag available assets:"
            jq -r '.assets[]?.name' <<<"$metadata" | sed 's/^/  /'
            if [[ "$name" == 'AzaharPlus' && "$tag" != 'AZAHAR_PLUS_2126_2_A' ]]; then
              echo "::warning::AzaharPlus tag $tag has not been security-reviewed for this workflow; skipping"
              continue
            fi
            if [[ "$name" == 'melonDS' ]]; then
              asset="$(jq -r '[.assets[] | select(.name | endswith("appimage-x86_64.zip"))] | first | .browser_download_url // empty' <<<"$metadata")"
            else
              asset="$(jq -r '[.assets[] | select(.name | endswith("-linux.AppImage"))] | first | .browser_download_url // empty' <<<"$metadata")"
            fi
            if [[ -z "$asset" ]]; then
              echo "::warning::No supported Linux artifact published for $name release $tag"
              continue
            fi
            dest="$RUNNER_TEMP/emulators/$name.download"
            curl --fail --location --silent --show-error --retry 3 --max-time 180 --output "$dest" "$asset"
            test -s "$dest"
            sha256sum "$dest"
            if [[ "$name" == 'melonDS' ]]; then
              mkdir -p "$RUNNER_TEMP/emulators/melonds-unpacked"
              unzip -q "$dest" -d "$RUNNER_TEMP/emulators/melonds-unpacked"
              find "$RUNNER_TEMP/emulators/melonds-unpacked" -maxdepth 4 -type f -print
              appimage="$(find "$RUNNER_TEMP/emulators/melonds-unpacked" -type f -iname '*.AppImage' -print -quit)"
              if [[ -z "$appimage" ]]; then echo "::error::melonDS ZIP contains no AppImage"; exit 1; fi
              chmod +x "$appimage"
              ln -s "$appimage" "$RUNNER_TEMP/emulators/melonDS"
            else
              chmod +x "$dest"
              ln -s "$dest" "$RUNNER_TEMP/emulators/azaharplus"
            fi
            echo "$name official release downloaded, SHA-256 recorded"

          done
          echo "$RUNNER_TEMP/emulators" >> "$GITHUB_PATH"
      - name: Report emulator availability without claiming StreetPass
        run: |
          python3 tools/emulator_preflight.py --json | tee emulator-preflight.json
          python3 - <<'PY'
          import json
          with open('emulator-preflight.json', encoding='utf-8') as f:
              result = json.load(f)
          expected = {'melonDS_to_melonDS', 'AzaharPlus_to_AzaharPlus_CECD', 'AzaharPlus_to_melonDS'}
          assert set(result['tests']) == expected
          assert all(value == 'NOT_RUN' for value in result['tests'].values())
          print('Emulator executable availability checked. No StreetPass exchange attempted.')
          PY
      - name: Summarize installation status and fail unmet milestone
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('emulator-preflight.json')
          if not report.is_file():
              raise SystemExit('No emulator preflight report produced')
          data = json.loads(report.read_text(encoding='utf-8'))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Emulator installation readiness\\n\\n')
              for name, result in data['emulators'].items():
                  summary.write(f"- {name}: **{'INSTALLED' if result['installed'] else 'BLOCKED'}**\\n")
              summary.write('\\nNo StreetPass exchange was performed.\\n')
          missing = [name for name, result in data['emulators'].items() if not result['installed']]
          if missing:
              raise SystemExit('Required emulator executables missing: ' + ', '.join(missing))
          PY
      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-provision-preflight
          path: emulator-preflight.json
          if-no-files-found: error
          retention-days: 7
