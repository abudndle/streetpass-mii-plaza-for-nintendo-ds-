name: Validate DS Plaza
on:
  push:
    branches: [main, 'dev/**', 'feature/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: dsplaza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host codec and storage tests
        run: make test
      - name: Verify USA 3DS TMD parser with synthetic fixtures
        env:
          PYTHONPATH: tools
        run: python3 -m unittest discover -s tests -p 'test_verify_3ds_tmd.py' -v
      - name: Verify proprietary files are absent
        run: |
          python3 - <<'PY'
          import pathlib, sys
          forbidden = {'.cia', '.ncch', '.cxi', '.3ds', '.romfs', '.exefs', '.tik'}
          paths = [str(p) for p in pathlib.Path('.').rglob('*')
                   if p.is_file() and '.git' not in p.parts
                   and p.suffix.lower() in forbidden]
          if paths:
              sys.exit('Proprietary/ROM files must stay private: ' + ', '.join(paths))
          PY
  # Build on self-hosted runners with BlocksDS preinstalled, or manually using 'make'.
  # Do NOT upload Nintendo game files, extracted assets or their converted derivatives.

  rom-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nitro Engine and DSMA BlocksDS package
        run: |
          set -eu
          wf-pacman -Sy --noconfirm blocksds-nitroengine blocksds-nflib
          wf-pacman -Ql blocksds-nitroengine
          ne_header=$(find /opt/wonderful/thirdparty/blocksds/external -type f -name NEMain.h -print -quit)
          ne_root=$(dirname "$(dirname "$ne_header")")
          test -n "$ne_header"
          test -s "$ne_root/lib/libNE.a"
          echo "BLOCKSDSEXT=$(dirname "$ne_root")" >> "$GITHUB_ENV"
          echo "Nitro Engine header: $ne_header"
          echo "Nitro Engine root: $ne_root"
          nf_header=$(find /opt/wonderful/thirdparty/blocksds/external -type f -iname "nf_lib.h" -print -quit)
          test -n "$nf_header"
          nf_root=$(dirname "$(dirname "$nf_header")")
          test -s "$nf_root/lib/libnflib.a"
          echo "NightFox\047s Lib root: $nf_root"
      - name: Build native DS/DSi homebrew ROM
        run: make
      - name: Validate output exists and is not empty
        run: test -s streetpass-plaza-ds.nds
      - name: Upload homebrew ROM only
        uses: actions/upload-artifact@v4
        with:
          name: streetpass-plaza-ds-homebrew
          path: streetpass-plaza-ds.nds
          if-no-files-found: error
          retention-days: 7

  rom-header-validation:
    if: github.event_name != 'schedule'
    needs: rom-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled homebrew ROM
        uses: actions/download-artifact@v4
        with:
          name: streetpass-plaza-ds-homebrew
      - name: Validate NDS header and ARM executable bounds
        run: python3 tools/verify_nds.py streetpass-plaza-ds.nds
