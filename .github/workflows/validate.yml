name: Validate DS Plaza
on:
  push:
    branches: [main, 'dev/**', 'feature/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: dsplaza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host codec and storage tests
        run: make test
      - name: Emulator diagnostics regression tests
        run: python3 -m unittest discover -s tests -p 'test_emulator_preflight.py' -v
      - name: Run emulator preflight and enforce truthful exchange statuses
        run: |
          python3 tools/emulator_preflight.py --json > emulator-preflight.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('emulator-preflight.json').read_text())
          assert set(report['emulators']) == {'melonDS', 'AzaharPlus'}
          assert report['tests'] == {
              'melonDS_to_melonDS': 'NOT_RUN',
              'AzaharPlus_to_AzaharPlus_CECD': 'NOT_RUN',
              'AzaharPlus_to_melonDS': 'NOT_RUN',
          }, 'Preflight must never report unperformed radio exchange as passed'
          print('Emulator preflight completed; all actual radio exchange tests NOT_RUN')
          PY
      - name: Verify proprietary files are absent
        run: |
          python3 - <<'PY'
          import pathlib, sys
          forbidden = {'.cia', '.ncch', '.cxi', '.3ds', '.romfs', '.exefs', '.tik'}
          paths = [str(p) for p in pathlib.Path('.').rglob('*')
                   if p.is_file() and '.git' not in p.parts
                   and p.suffix.lower() in forbidden]
          if paths:
              sys.exit('Proprietary/ROM files must stay private: ' + ', '.join(paths))
          PY
  # Build on self-hosted runners with BlocksDS preinstalled, or manually using 'make'.
  # Do NOT upload Nintendo game files, extracted assets or their converted derivatives.

  rom-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native DS/DSi homebrew ROM
        run: make
      - name: Validate output exists and is not empty
        run: test -s streetpass-plaza-ds.nds
      - name: Upload homebrew ROM only
        uses: actions/upload-artifact@v4
        with:
          name: streetpass-plaza-ds-homebrew
          path: streetpass-plaza-ds.nds
          if-no-files-found: error
          retention-days: 7

  rom-header-validation:
    if: github.event_name != 'schedule'
    needs: rom-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled homebrew ROM
        uses: actions/download-artifact@v4
        with:
          name: streetpass-plaza-ds-homebrew
      - name: Validate NDS header and ARM executable bounds
        run: python3 tools/verify_nds.py streetpass-plaza-ds.nds
