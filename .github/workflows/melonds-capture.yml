name: Genuine melonDS screenshot capture
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate DS Plaza"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 and AppImage runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick unzip libfuse2
      - name: Download official melonDS 1.1 Linux AppImage
        run: |
          set -eu
          curl --fail --location --retry 3 -o /tmp/melonds.zip https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-appimage-x86_64.zip
          echo "bf377420a2e95f2cd2cdda17d5372b51c2534f858b038db9ec6d129554875124  /tmp/melonds.zip" | sha256sum --check
          mkdir -p /opt/melonds
          unzip -q /tmp/melonds.zip -d /opt/melonds
          APPIMAGE="$(find /opt/melonds -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          echo "$APPIMAGE" > /tmp/melonds-appimage-path
      - name: Download ROM from the validated build run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          mkdir -p rom
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" --name streetpass-plaza-ds-homebrew --dir rom
          else
            gh run download --repo "${{ github.repository }}" --name streetpass-plaza-ds-homebrew --dir rom
          fi
          test -s rom/streetpass-plaza-ds.nds
          python3 tools/verify_nds.py rom/streetpass-plaza-ds.nds
      - name: Launch official melonDS and capture actual window
        run: |
          set -eu
          mkdir -p screenshots
          APPIMAGE="$(cat /tmp/melonds-appimage-path)"
          xvfb-run -a -s '-screen 0 1024x768x24' sh -ec '
            "$1" "$2" > /tmp/melonds.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 15
            kill -0 "$pid"
            bash tools/capture_melonds.sh screenshots/plaza-boot.png
          ' sh "$APPIMAGE" rom/streetpass-plaza-ds.nds
          python3 tools/check_png.py screenshots/plaza-boot.png
      - name: Upload genuine screenshot only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: melonds-real-window-screenshot
          path: screenshots/plaza-boot.png
          if-no-files-found: error
          retention-days: 7
